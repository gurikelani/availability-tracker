<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KCLFC Fixtures</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="site-header">
    <h1>KCLFC <span>Fixtures</span></h1>
    <a class="btn-small" href="/fixture/new">+ Add fixture</a>
  </header>

  {% for f in fixtures %}
  <a class="card" href="/fixture/{{ f[0] }}">
    <div class="card-title">{{ f[1] }}</div>
    <div class="card-meta">{{ f[2] }}{% if f[3] %} · {{ f[3] }}{% endif %}</div>
    <div class="card-cta">Respond →</div>
  </a>
  {% endfor %}
</body>
</html>
